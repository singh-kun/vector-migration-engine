[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vector-migration-engine"
version = "1.0.0a1"
description = "Capability-aware, resumable migrations between vector databases"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Suraj Singh" }]
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
chroma = ["chromadb>=1.0"]
qdrant = ["qdrant-client>=1.10"]
server = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "PyJWT[crypto]>=2.10,<3",
]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
vme = "vme.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["vme*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
markers = [
  "integration: tests that exercise real external database SDKs or engines",
]
