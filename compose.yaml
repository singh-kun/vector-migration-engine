services:
  vme-api:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      VME_AUTH_MODE: token
      VME_API_TOKEN: ${VME_API_TOKEN:?set VME_API_TOKEN}
      VME_RUN_WORKER: "false"
      VME_DATA_ROOTS: /data
      VME_ENDPOINT_ALLOWLIST: ${VME_ENDPOINT_ALLOWLIST:-}
      VME_SECRET_ENV_ALLOWLIST: ${VME_SECRET_ENV_ALLOWLIST:-}
      VME_SECRET_FILE_ROOTS: /run/secrets
    volumes:
      - vme-state:/var/lib/vme
      - ./data:/data:ro
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "10001:10001"
    init: true
    pids_limit: 256
    mem_limit: 512m

  vme-worker:
    build: .
    command: ["worker"]
    environment:
      VME_STATE_PATH: /var/lib/vme/service.sqlite3
      VME_DATA_ROOTS: /data
      VME_ENDPOINT_ALLOWLIST: ${VME_ENDPOINT_ALLOWLIST:-}
      VME_SECRET_ENV_ALLOWLIST: ${VME_SECRET_ENV_ALLOWLIST:-}
      VME_SECRET_FILE_ROOTS: /run/secrets
    volumes:
      - vme-state:/var/lib/vme
      - ./data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "10001:10001"
    init: true
    pids_limit: 512
    mem_limit: 4g
    healthcheck:
      disable: true

volumes:
  vme-state:
